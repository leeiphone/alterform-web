<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
      display: inline-block;
    }
    .logo b { font-weight: 700; }
    .logo span { font-weight: 400; }
    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255,255,255,.85);
      border-radius: 6px;
      background: rgba(0,0,0,.15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255,255,255,.8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,.9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
    }
    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links { gap: 16px; }
      .nav-links a, .logo { font-size: 13px; }
      .dots { gap: 20px; right: 16px; }
      .dot { width: 10px; height: 10px; }
      .cta-row { right: -8vw; }
      .count { font-size: 120px; }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) { display: none; }
    }
  </style>

  <!-- Importmap for Three.js r169 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>

<section class="hero" id="hero">
  <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
  <div class="ui">
    <h1 class="sr-only">Explore New Ideas</h1>
    <header class="nav">
      <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </header>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M11 6l-6 6 6 6"/>
        </svg>
      </button>
      <button class="arrow" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <nav class="dots">
      <button class="dot"></button>

      <button class="dot"></button>

    <div class="cta-row">

</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');

// Renderer
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false
});
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Camera
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

// Scene Graphs
const scene = new THREE.Scene();
const bgScene = new THREE.Scene();
const bgCamera = new THREE.Camera();

const pivot = new THREE.Group();
const spinner = new THREE.Group();
scene.add(pivot);
pivot.add(spinner);

// Initial spinner rotation
spinner.rotation.set(-0.42, 0.62, 0.18);

// 4a. Background Headline (2D Canvas -> CanvasTexture)
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
const bgTexture = new THREE.CanvasTexture(bgCanvas);
bgTexture.colorSpace = THREE.SRGBColorSpace;
bgTexture.minFilter = THREE.LinearFilter;
bgTexture.magFilter = THREE.LinearFilter;
bgTexture.generateMipmaps = false;

const bgQuadMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTex: { value: bgTexture }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(uTex, vUv);
      #include <colorspace_fragment>
    }
  `,
  depthTest: false,
  depthWrite: false
});
bgQuadMaterial.frustumCulled = false;

const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgQuadMaterial);
bgQuad.frustumCulled = false;
bgScene.add(bgQuad);

// Render Targets
let rtBack, rtFront;
function updateRenderTargets(w, h) {
  if (rtBack) rtBack.dispose();
  if (rtFront) rtFront.dispose();

  const options = {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    stencilBuffer: false
  };
  rtBack = new THREE.WebGLRenderTarget(w, h, options);
  rtFront = new THREE.WebGLRenderTarget(w, h, options);
}

// 4d. Glass Material Shaders
const glassVertexShader = `
  varying vec3 vNormal;
  varying vec3 vEye;

  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vec4 mvPos = viewMatrix * worldPos;
    gl_Position = projectionMatrix * mvPos;
    vNormal = normalize(normalMatrix * normal);
    vEye = normalize(mvPos.xyz);
  }
`;

const glassFragmentShader = `
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform float uIorR;
  uniform float uIorY;
  uniform float uIorG;
  uniform float uIorC;
  uniform float uIorB;
  uniform float uIorP;
  uniform float uRefractPower;
  uniform float uChromatic;
  uniform float uSaturation;
  uniform float uShininess;
  uniform float uDiffuseness;
  uniform float uFresnelPower;
  uniform vec3 uLight;
  uniform float uBackside;

  varying vec3 vNormal;
  varying vec3 vEye;

  float specularLight(vec3 lightDir, float shininess, float diffuseness, vec3 n, vec3 eye) {
    vec3 l = normalize(-lightDir);
    vec3 v = -eye;
    vec3 h = normalize(l + v);
    float spec = pow(max(dot(n, h), 0.0), shininess);
    float diff = max(dot(n, l), 0.0) * diffuseness;
    return spec + diff;
  }

  float luma(vec3 color) {
    return dot(color, vec3(0.2125, 0.7154, 0.0721));
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec3 n = normalize(vNormal);
    if (uBackside > 0.5) n = -n;
    vec3 eye = normalize(vEye);

    const int LOOP = 16;
    vec3 totalColor = vec3(0.0);

    for (int i = 0; i < LOOP; i++) {
      float slide = float(i) / float(LOOP) * 0.045;

      vec3 refrR = refract(eye, n, 1.0 / uIorR);
      vec3 refrY = refract(eye, n, 1.0 / uIorY);
      vec3 refrG = refract(eye, n, 1.0 / uIorG);
      vec3 refrC = refract(eye, n, 1.0 / uIorC);
      vec3 refrB = refract(eye, n, 1.0 / uIorB);
      vec3 refrP = refract(eye, n, 1.0 / uIorP);

      vec2 uvR = uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
      vec2 uvY = uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
      vec2 uvG = uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
      vec2 uvC = uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
      vec2 uvB = uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
      vec2 uvP = uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

      vec4 tR = texture2D(uTexture, uvR);
      vec4 tY = texture2D(uTexture, uvY);
      vec4 tG = texture2D(uTexture, uvG);
      vec4 tC = texture2D(uTexture, uvC);
      vec4 tB = texture2D(uTexture, uvB);
      vec4 tP = texture2D(uTexture, uvP);

      float r = tR.x * 0.5;
      float y = (tY.x * 2.0 + tY.y * 2.0 - tY.z) / 6.0;
      float g = tG.y * 0.5;
      float c = (tC.y * 2.0 + tC.z * 2.0 - tC.x) / 6.0;
      float b = tB.z * 0.5;
      float p = (tP.z * 2.0 + tP.x * 2.0 - tP.y) / 6.0;

      float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
      float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
      float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

      totalColor += vec3(R, G, B);
    }

    vec3 color = totalColor / float(LOOP);
    float lum = luma(color);
    color = mix(vec3(lum), color, uSaturation);

    float spec1 = specularLight(uLight, uShininess, uDiffuseness, n, eye);
    float spec2 = 0.6 * specularLight(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
    float spec = spec1 + spec2;
    color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

    float f = pow(1.0 + dot(eye, n), uFresnelPower);
    color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

    color += vec3(0.004, 0.005, 0.007);
    gl_FragColor = vec4(color, 1.0);
    #include <colorspace_fragment>
  }
`;

const commonUniforms = {
  uResolution: { value: new THREE.Vector2() },
  uIorR: { value: 1.15 },
  uIorY: { value: 1.16 },
  uIorG: { value: 1.18 },
  uIorC: { value: 1.22 },
  uIorB: { value: 1.22 },
  uIorP: { value: 1.22 },
  uChromatic: { value: 0.5 },
  uSaturation: { value: 1.08 },
  uShininess: { value: 90.0 },
  uDiffuseness: { value: 0.02 },
  uFresnelPower: { value: 5.0 },
  uLight: { value: new THREE.Vector3(-1, 1, 1) }
};

const frontMat = new THREE.ShaderMaterial({
  uniforms: {
    ...commonUniforms,
    uTexture: { value: null },
    uRefractPower: { value: 0.30 },
    uBackside: { value: 0.0 }
  },
  vertexShader: glassVertexShader,
  fragmentShader: glassFragmentShader,
  side: THREE.FrontSide
});

const backMat = new THREE.ShaderMaterial({
  uniforms: {
    ...commonUniforms,
    uTexture: { value: null },
    uRefractPower: { value: 0.22 },
    uBackside: { value: 1.0 }
  },
  vertexShader: glassVertexShader,
  fragmentShader: glassFragmentShader,
  side: THREE.BackSide
});

// Cube Mesh Setup
let cubeMesh = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 1, 8, 0.12), frontMat);
spinner.add(cubeMesh);

// Load 3D Model
const gltfLoader = new GLTFLoader();
gltfLoader.load(
  MODEL_URL,
  (gltf) => {
    try {
      const geometries = [];
      gltf.scene.updateMatrixWorld(true);
      gltf.scene.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const g = child.geometry.clone();
          g.deleteAttribute('uv');
          g.deleteAttribute('color');
          g.deleteAttribute('tangent');
          const mergedV = mergeVertices(g, 1e-4);
          mergedV.computeVertexNormals();
          mergedV.applyMatrix4(child.matrixWorld);
          geometries.push(mergedV);
        }
      });

      if (geometries.length > 0) {
        const mergedGeometry = geometries.length === 1 ? geometries[0] : mergeGeometries(geometries);
        mergedGeometry.computeBoundingBox();
        mergedGeometry.center();
        const size = new THREE.Vector3();
        mergedGeometry.boundingBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          mergedGeometry.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
        }
        cubeMesh.geometry.dispose();
        cubeMesh.geometry = mergedGeometry;
      }
    } catch (e) {
      console.warn('Fallback to RoundedBoxGeometry', e);
    }
    loaderEl.classList.add('done');
  },
  undefined,
  (err) => {
    console.warn('GLTF loading failed, using fallback geometry', err);
    loaderEl.classList.add('done');
  }
);

// 4a & 4c. Layout Calculation
function drawHeadline(W, H, dpr, mobile) {
  bgCanvas.width = W * dpr;
  bgCanvas.height = H * dpr;

  bgCtx.fillStyle = '#000';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
  const maxAllowedWidth = W * (mobile ? 0.9 : 0.5);

  const lines = ['Explore', 'New', 'Ideas'];

  bgCtx.font = `800 ${fs * dpr}px Poppins`;
  let widest = 0;
  for (const line of lines) {
    const w = bgCtx.measureText(line).width / dpr;
    if (w > widest) widest = w;
  }
  if (widest > maxAllowedWidth && widest > 0) {
    fs = fs * (maxAllowedWidth / widest);
  }

  bgCtx.font = `800 ${fs * dpr}px Poppins`;
  bgCtx.fillStyle = '#e9e9e9';
  bgCtx.textAlign = 'center';
  bgCtx.textBaseline = 'alphabetic';

  const cx = W * (mobile ? 0.5 : 0.505) * dpr;
  const cy = H * (mobile ? 0.45 : 0.468) * dpr;
  const gap = fs * 1.07 * dpr;
  const cap = fs * 0.7 * dpr;

  for (let i = 0; i < lines.length; i++) {
    const y = cy + cap / 2 + (i - 1) * gap;
    bgCtx.fillText(lines[i], cx, y);
  }

  bgTexture.needsUpdate = true;
}

function layout() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  const mobile = (W < 768) || (W / H < 1);

  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  const drawW = Math.floor(W * dpr);
  const drawH = Math.floor(H * dpr);
  updateRenderTargets(drawW, drawH);

  frontMat.uniforms.uResolution.value.set(drawW, drawH);
  backMat.uniforms.uResolution.value.set(drawW, drawH);

  drawHeadline(W, H, dpr, mobile);

  // Cube Placement
  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  const visH = 2 * Math.tan(fovRad / 2) * 10;
  const visW = visH * camera.aspect;

  const sx = mobile ? 0.5 : 0.517;
  const sy = mobile ? 0.45 : 0.488;
  pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

  const edgePx = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
  const s = (edgePx / H) * visH;
  pivot.scale.set(s, s, s);
}

// 5. Interaction & Animation State
let isDragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let velX = 0;
let velY = 0;
let lastMoveTime = 0;

let idleTime = 0;
let smoothYRotRemaining = 0;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  lastMoveTime = performance.now();
  velX = 0;
  velY = 0;
  smoothYRotRemaining = 0;
  idleTime = 0;
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const now = performance.now();
  const dt = Math.max((now - lastMoveTime) / 1000, 0.001);

  const deltaX = e.clientX - lastPointerX;
  const deltaY = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  lastMoveTime = now;

  const dx = deltaX * 0.008;
  const dy = deltaY * 0.008;

  const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
  const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
  
  spinner.quaternion.premultiply(qX);
  spinner.quaternion.premultiply(qY);

  velX = deltaX * (0.01667 / dt);
  velY = deltaY * (0.01667 / dt);
  idleTime = 0;
});

function stopDragging(e) {
  if (!isDragging) return;
  isDragging = false;
  canvas.classList.remove('dragging');
  try {
    canvas.releasePointerCapture(e.pointerId);
  } catch (_) {}
}

canvas.addEventListener('pointerup', stopDragging);
canvas.addEventListener('pointercancel', stopDragging);

// Arrow buttons: Smoothly rotate -90° / +90° around Y
document.getElementById('prev').addEventListener('click', () => {
  smoothYRotRemaining -= Math.PI / 2;
  velX = 0;
  velY = 0;
  idleTime = 0;
});
document.getElementById('next').addEventListener('click', () => {
  smoothYRotRemaining += Math.PI / 2;
  velX = 0;
  velY = 0;
  idleTime = 0;
});

// Dots interaction
const dots = document.querySelectorAll('.dot');
dots.forEach((dot) => {
  dot.addEventListener('click', () => {
    dots.forEach((d) => d.classList.remove('active'));
    dot.classList.add('active');
  });
});

window.addEventListener('resize', layout);
if (document.fonts) {
  document.fonts.addEventListener('loadingdone', () => {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio, 2);
    const mobile = (W < 768) || (W / H < 1);
    drawHeadline(W, H, dpr, mobile);
  });
}

// 4e. Render Loop
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const rawDt = (now - lastTime) / 1000;
  lastTime = now;
  const dt = Math.min(rawDt, 0.05);

  // Arrow button smooth step
  if (Math.abs(smoothYRotRemaining) > 0.0005) {
    const step = smoothYRotRemaining * Math.min(1.0, 0.09 * dt * 60);
    const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
    spinner.quaternion.premultiply(qY);
    smoothYRotRemaining -= step;
  } else {
    smoothYRotRemaining = 0;
  }

  // Inertia and Idle Drift
  if (!isDragging && smoothYRotRemaining === 0) {
    if (Math.abs(velX) > 0.01 || Math.abs(velY) > 0.01) {
      const dx = velX * 0.008;
      const dy = velY * 0.008;
      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(qX);
      spinner.quaternion.premultiply(qY);

      const damp = Math.pow(0.94, dt * 60);
      velX *= damp;
      velY *= damp;
    } else {
      velX = 0;
      velY = 0;
    }

    idleTime += dt;
    if (idleTime > 0.6) {
      const blend = Math.min(1.0, (idleTime - 0.6) / 1.0);
      const dy = 0.0035 * blend * (dt * 60);
      const dx = 0.0012 * blend * (dt * 60);
      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dy);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dx);
      spinner.quaternion.premultiply(qX);
      spinner.quaternion.premultiply(qY);
    }
  }

  // Two-Pass Refraction Render Pipeline
  if (rtBack && rtFront) {
    // Pass 1: Render background to rtBack
    renderer.setRenderTarget(rtBack);
    renderer.clear();
    renderer.render(bgScene, bgCamera);

    // Pass 2: Render background to rtFront, then backside of cube with backMat
    backMat.uniforms.uTexture.value = rtBack.texture;
    renderer.setRenderTarget(rtFront);
    renderer.clear();
    renderer.render(bgScene, bgCamera);

    cubeMesh.material = backMat;
    renderer.autoClear = false;
    renderer.render(scene, camera);

    // Pass 3: Render background to screen, then frontside of cube with frontMat
    frontMat.uniforms.uTexture.value = rtFront.texture;
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(bgScene, bgCamera);

    renderer.clearDepth();
    cubeMesh.material = frontMat;
    renderer.render(scene, camera);
    renderer.autoClear = true;
  }
}

// Initialize with Font Ready check
Promise.race([
  Promise.all([
    document.fonts ? document.fonts.load('800 100px Poppins') : Promise.resolve(),
    document.fonts ? document.fonts.ready : Promise.resolve()
  ]),
  new Promise((r) => setTimeout(r, 2500))
]).then(() => {
  layout();
  lastTime = performance.now();
  requestAnimationFrame(animate);
});
</script>

</body>
</html>
